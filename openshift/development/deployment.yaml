kind: Deployment
apiVersion: apps/v1
metadata:
  name: apemformularios
  labels:
    app: apemformularios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apemformularios
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: apemformularios
        deployment: apemformularios
    spec:
      containers:
        - name: apemformularios
          env:
            - name: TZ
              value: America/Buenos_Aires
            - name: NODE_ENV
              value: production
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          image: 'image-registry.openshift-image-registry.svc:5000/apem-dev/apemformularios:latest'
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900