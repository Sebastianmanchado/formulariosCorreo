kind: Deployment
apiVersion: apps/v1
metadata:
  name: apemformularios-test
  labels:
    app: apemformularios-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apemformularios-test
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: apemformularios-test
        deployment: apemformularios-test
    spec:
      containers:
        - name: apemformularios-test
          env:
            - name: TZ
              value: America/Buenos_Aires
            - name: NODE_ENV
              value: production
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          image: 'image-registry.openshift-image-registry.svc:5000/apem-dev/apemformularios:latest'
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900