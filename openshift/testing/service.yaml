kind: Service
apiVersion: v1
metadata:
  name: apemformularios-test
  labels:
    app: apemformularios-test
spec:
  ipFamilies:
    - IPv4
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: apemformularios-test
    deployment: apemformularios-test